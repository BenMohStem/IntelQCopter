; ============================================================================
; PlatformIO - IntelQCopter Flight Controller (ESP32-S3 with WiFi PID Tuner)
; ============================================================================
; Target: ESP32-S3 DevKitC-1 N8 (8 MB flash, no PSRAM)
; WiFi: Access Point mode for wireless PID tuning via WebSocket
; ============================================================================

[platformio]
default_envs = esp32s3

[env:esp32s3]
platform = espressif32
board = esp32-s3-devkitc-1
framework = arduino
monitor_speed = 115200
upload_port = COM3

build_flags = 
    -DCORE_DEBUG_LEVEL=0
    -Wall
    -Wextra

lib_deps = 
    bblanchon/ArduinoJson @ ^6.21.0

upload_speed = 921600

; ============================================================================
; Build commands:
;   pio run                    - Build firmware
;   pio run -t upload           - Build and upload to ESP32-S3 (COM3)
;   pio device monitor          - View serial output
; ============================================================================