[platformio]
default_envs = acquisition
src_dir = .

[env:acquisition]
platform = espressif32@7.1.3
board = esp32-s3-devkitc-1
framework = arduino
build_src_filter = +<main.cpp>
build_flags = -DARDUINO_RUNNING_CORE=1
extra_scripts = pre:source_stamp.py
monitor_speed = 921600
lib_deps = adafruit/Adafruit MPU6050@2.2.9
