[platformio]
default_envs = esp32-s3-calibration-500hz

[env:esp32-s3-calibration-500hz]
platform = espressif32@7.1.3
board = esp32-s3-devkitc-1
framework = arduino
build_src_filter = -<mag_probe.cpp> +<main.cpp>
monitor_speed = 921600
build_flags =
    -std=gnu++17
    -DCORE_DEBUG_LEVEL=0
    -DIQ_I2C_HZ=400000
    -DIQ_WIFI_ENABLED=0
    -DIQ_MAG_TEXT_DIAGNOSTIC=0
    -DIQ_MAG_CONTROL1=0x3D
    -DIQ_SCHEDULER_LATE_THRESHOLD_US=250
build_unflags = -std=gnu++11
lib_deps =
    adafruit/Adafruit BMP280 Library@2.6.8
    adafruit/Adafruit Unified Sensor@1.1.15
    adafruit/Adafruit BusIO@1.17.4
; For native USB CDC on ESP32-S3 (when not using UART bridge), try adding:
;    -DARDUINO_USB_CDC_ON_BOOT=1
;    -DARDUINO_USB_MODE=1


; One optional MAG-ONLY diagnostic using the historical v13 source.
; Run with: .\tools\start_calibration.ps1 -MagProbe
; This build is intentionally NOT compatible with calibration GUI binary packets.
[env:esp32-s3-mag-probe-common]
platform = espressif32@7.1.3
board = esp32-s3-devkitc-1
framework = arduino
monitor_speed = 115200
build_src_filter = -<*> +<mag_probe.cpp>
build_unflags = -std=gnu++11
build_flags =
    -std=gnu++17
    -DCORE_DEBUG_LEVEL=0
    -DIQ_WIFI_ENABLED=0
    -DIQ_MAG_TEXT_DIAGNOSTIC=1
    -DIQ_MAG_CSV_DIVIDER=1

[env:esp32-s3-mag-probe]
extends = env:esp32-s3-mag-probe-common
build_flags = ${env:esp32-s3-mag-probe-common.build_flags} -DIQ_MAG_BOOT_PROFILE=100
    -DIQ_I2C_HZ=100000

[env:esp32-s3-mag-probe-200hz]
extends = env:esp32-s3-mag-probe-common
build_flags = ${env:esp32-s3-mag-probe-common.build_flags} -DIQ_MAG_BOOT_PROFILE=200
    -DIQ_I2C_HZ=100000

[env:esp32-s3-mag-probe-200hz-slowpoll]
extends = env:esp32-s3-mag-probe-common
build_flags = ${env:esp32-s3-mag-probe-common.build_flags} -DIQ_MAG_BOOT_PROFILE=200
    -DIQ_I2C_HZ=100000
    -DIQ_MAG_POLL_INTERVAL_US=4000

[env:esp32-s3-mag-probe-200hz-repeatstart]
extends = env:esp32-s3-mag-probe-common
build_flags = ${env:esp32-s3-mag-probe-common.build_flags} -DIQ_MAG_BOOT_PROFILE=200
    -DIQ_I2C_HZ=100000
    -DIQ_MAG_STOP_START_READ=0

[env:esp32-s3-mag-probe-200hz-lowosr]
extends = env:esp32-s3-mag-probe-common
build_flags = ${env:esp32-s3-mag-probe-common.build_flags} -DIQ_MAG_BOOT_PROFILE=200
    -DIQ_I2C_HZ=100000
    -DIQ_MAG_200HZ_LOW_OSR=1

[env:esp32-s3-mag-probe-200hz-lowosr-400k]
extends = env:esp32-s3-mag-probe-common
build_flags = ${env:esp32-s3-mag-probe-common.build_flags} -DIQ_MAG_BOOT_PROFILE=200
    -DIQ_I2C_HZ=400000
    -DIQ_MAG_200HZ_LOW_OSR=1

[env:esp32-s3-mag-probe-continuous]
extends = env:esp32-s3-mag-probe-common
build_flags = ${env:esp32-s3-mag-probe-common.build_flags} -DIQ_MAG_BOOT_PROFILE=0
    -DIQ_I2C_HZ=400000

[env:esp32-s3-mag-probe-continuous-100k]
extends = env:esp32-s3-mag-probe-common
build_flags = ${env:esp32-s3-mag-probe-common.build_flags} -DIQ_MAG_BOOT_PROFILE=0
    -DIQ_I2C_HZ=100000

[env:esp32-s3-mag-probe-continuous-fast]
extends = env:esp32-s3-mag-probe-common
build_flags = ${env:esp32-s3-mag-probe-common.build_flags} -DIQ_MAG_BOOT_PROFILE=0 -DIQ_MAG_CONTINUOUS_FAST=1
    -DIQ_I2C_HZ=400000

[env:esp32-s3-mag-probe-continuous-fast-100k]
extends = env:esp32-s3-mag-probe-common
build_flags = ${env:esp32-s3-mag-probe-common.build_flags} -DIQ_MAG_BOOT_PROFILE=0 -DIQ_MAG_CONTINUOUS_FAST=1
    -DIQ_I2C_HZ=100000

[env:esp32-s3-mag-probe-continuous-03-100k]
extends = env:esp32-s3-mag-probe-common
build_flags = ${env:esp32-s3-mag-probe-common.build_flags} -DIQ_MAG_BOOT_PROFILE=0
    -DIQ_I2C_HZ=100000
    -DIQ_MAG_CONTINUOUS_CTRL1=0x03
