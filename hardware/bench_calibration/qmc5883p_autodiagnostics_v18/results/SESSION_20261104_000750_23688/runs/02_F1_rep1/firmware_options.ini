; IntelQCopter v18 / ESP32-S3 QMC5883P system differential bench testing
; Auto runner rewrites build flags per preset and restores this file at the end.
[env:esp32-s3-calibration-500hz]
platform = espressif32@7.1.3
board = esp32-s3-devkitc-1
framework = arduino
monitor_speed = 115200
upload_speed = 460800

; Serial in this firmware is DIAGNOSTICS. The full 500 Hz binary logger is separate.
; The ESP32-S3 UART/native-USB selection must match your board wiring.
build_flags =
    -DIQ_RUN_NONCE=31551175
    -DIQ_MAG_BOOT_PROFILE=50
    -DIQ_MAG_OSR1=8
    -DIQ_MAG_CSV_DIVIDER=1
    -DIQ_I2C_HZ=100000
    -DIQ_SERIAL_BAUD=115200
    -DIQ_MAG_READ_STOP=1
    -DIQ_MAG_SOFT_RESET=0
    -DIQ_MAG_START_ENABLE=1
    -DIQ_MAG_CTRL1_OVERRIDE=0
    -DIQ_RECOVERY_ENABLE=0
    -DIQ_RECOVERY_MAX_ATTEMPTS=2
    -DIQ_ALLOW_100HZ_FALLBACK=0
    -DIQ_BUS_LOAD_ENABLE=0
    -DIQ_WIFI_STRESS_MODE=0
    -DIQ_WIFI_START_DELAY_MS=15000
    -DIQ_WIFI_SCAN_INTERVAL_MS=10000
