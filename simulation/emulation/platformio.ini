[platformio]
default_envs = esp32-s3-qemu
src_dir = .
include_dir = ../../firmware/include
build_dir = ../../build/emulation-pio

[env:esp32-s3-qemu]
platform = espressif32@7.1.3
board = esp32-s3-devkitc-1
framework = arduino
board_build.flash_mode = dio
board_build.arduino.memory_type = dio_qspi
build_src_filter = +<main.cpp> +<scenario.c> +<flight_core.c>
build_flags = -Wall -Wextra -DCORE_DEBUG_LEVEL=0
monitor_speed = 115200
