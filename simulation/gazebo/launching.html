<!doctype html><html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Starting IntelQCopter simulation</title><style>body{background:#0c1724;color:#e5eff6;max-width:850px;margin:12vh auto;font:18px/1.6 system-ui;padding:25px}a{color:#60ddc4}section{background:#14283b;border:1px solid #34516b;border-radius:14px;padding:28px}progress{width:100%}</style><section><h1>Starting your simulation…</h1><p id="message">Preparing native Gazebo cameras and the C flight controller.</p><progress></progress><p>Video and telemetry record automatically. End session will finish recording and close this tab.</p><a href="/" target="_blank">Open the home workshop</a></section><script>
const run=new URLSearchParams(location.search).get('run');let began=Date.now();
async function wait(){if(!run)return;try{let r=await fetch('/status',{cache:'no-store'}),s=await r.json();if(s.run===run&&s.live){location.replace('http://127.0.0.1:8087/?managed_run='+encodeURIComponent(run));return}if(s.run===run&&!s.running&&s.returncode!==null){document.getElementById('message').textContent='Startup stopped. Return home and inspect the session/launcher logs.';return}document.getElementById('message').textContent='Preparing '+run+' · '+Math.round((Date.now()-began)/1000)+' s. The live station will open here automatically.'}catch(e){document.getElementById('message').textContent='Waiting for the home workshop…'}if(Date.now()-began<180000)setTimeout(wait,700);else document.getElementById('message').textContent='Startup is taking longer than expected. Check the home workshop and original launcher log.'}wait();
</script></html>
