<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 565" role="img" aria-labelledby="title desc">
<title id="title">Six control loops</title><desc id="desc">Roll and pitch each use an outer angle P and inner rate PI. Yaw uses a rate PI. Vertical stick advances height reference, then one altitude PID uses height and velocity feedback. Mixer combines all corrections.</desc>
<defs><marker id="a" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0L8 4L0 8" fill="#52707f"/></marker></defs>
<rect width="1100" height="565" rx="18" fill="#f1f6fa"/>
<g font-family="Arial,sans-serif" fill="#17324d"><text x="28" y="42" font-size="23" font-weight="700">Six controllers · four mixer channels</text><text x="28" y="70" font-size="14">Angle → requested rate → correction · each feedback error is reference minus measurement</text>
<g fill="white" stroke="#a6bbc4"><rect x="25" y="100" width="210" height="70" rx="9"/><rect x="25" y="205" width="210" height="70" rx="9"/><rect x="25" y="310" width="210" height="70" rx="9"/><rect x="25" y="415" width="210" height="85" rx="9"/></g>
<g font-size="16"><text x="43" y="128">Right stick: roll angle</text><text x="43" y="153">φ reference (degrees)</text><text x="43" y="233">Right stick: pitch angle</text><text x="43" y="258">θ reference (degrees)</text><text x="43" y="338">Left stick: yaw rate</text><text x="43" y="363">r reference (deg/s)</text><text x="43" y="442">Left vertical: speed</text><text x="43" y="469">Integrate → height ref.</text></g>
<g fill="#e0f1f0" stroke="#007f87"><rect x="290" y="100" width="170" height="70" rx="9"/><rect x="290" y="205" width="170" height="70" rx="9"/><rect x="535" y="100" width="170" height="70" rx="9"/><rect x="535" y="205" width="170" height="70" rx="9"/><rect x="535" y="310" width="170" height="70" rx="9"/><rect x="290" y="415" width="415" height="85" rx="9"/></g>
<g font-size="17" font-weight="700"><text x="307" y="129">1 · Roll angle P</text><text x="307" y="234">3 · Pitch angle P</text><text x="552" y="129">2 · Roll rate PI</text><text x="552" y="234">4 · Pitch rate PI</text><text x="552" y="339">5 · Yaw rate PI</text><text x="307" y="444">6 · Height PID</text></g>
<g font-size="14"><text x="307" y="153">Feedback: estimated φ</text><text x="307" y="258">Feedback: estimated θ</text><text x="552" y="153">Feedback: gyro p</text><text x="552" y="258">Feedback: gyro q</text><text x="552" y="363">Feedback: gyro r</text><text x="307" y="471">P + I on height error; D from v command − v estimate</text></g>
<g stroke="#52707f" fill="none" stroke-width="2" marker-end="url(#a)"><path d="M235 135H290"/><path d="M460 135H535"/><path d="M235 240H290"/><path d="M460 240H535"/><path d="M235 345H535"/><path d="M235 455H290"/><path d="M705 135H850V220H895"/><path d="M705 240H895"/><path d="M705 345H850V300H895"/><path d="M705 455H875V320H895"/></g>
<rect x="895" y="190" width="175" height="165" rx="12" fill="#17324d"/><g fill="white"><text x="917" y="226" font-size="19" font-weight="700">F450 mixer</text><text x="917" y="257" font-size="15">Collective + R/P/Y</text><text x="917" y="286" font-size="15">FL · FR · RR · RL</text><text x="917" y="331" font-size="13">Demands only</text></g>
<text x="28" y="544" font-size="14" fill="#657785">RT increases climb/collective allowance. Physical arming and ESC outputs remain disabled.</text>
</g></svg>
