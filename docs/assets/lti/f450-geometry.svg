<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1040 620" role="img" aria-labelledby="title desc">
<title id="title">F450 X geometry viewed from above</title><desc id="desc">Four motor centers at plus or minus 159.1 millimeters along x and y, opposite diagonal 450 millimeters, forward x at top and left y at left. Motor order FL FR RR RL. Colors are illustrative.</desc>
