<g transform="translate(687 145)"><text font-size="18" font-weight="700">Two different lengths</text><text y="38" font-size="16">Center → motor: l = 225 mm</text><text y="67" font-size="16">Roll / pitch lever: a = l / √2</text><text y="110" font-size="18" font-weight="700">Propeller geometry</text><text y="145" font-size="16">9047: diameter 228.6 mm</text><text y="175" font-size="16">Adjacent centers: 318.2 mm</text><text y="205" font-size="16">Ideal tip clearance: 89.6 mm</text><text y="248" font-size="18" font-weight="700">Read the drawing correctly</text><text y="283" font-size="15">+z points out of this page.</text><text y="311" font-size="15">Thrust acts along +z at each rotor.</text><text y="339" font-size="15">Yellow block: illustrative battery.</text><text y="367" font-size="15">Mounts, COM and spin need checking.</text><text y="395" font-size="14" fill="#657785">Not a measured CAD model.</text></g>
