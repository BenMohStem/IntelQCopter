<rect x="310" y="290" width="90" height="90" rx="18" fill="#17324d"/><rect x="330" y="302" width="50" height="66" rx="6" fill="#d3a849"/><circle cx="355" cy="335" r="5" fill="white"/>
<g fill="#17324d" stroke="white" stroke-width="3"><circle cx="205" cy="185" r="22"/><circle cx="505" cy="185" r="22"/><circle cx="505" cy="485" r="22"/><circle cx="205" cy="485" r="22"/></g>
<g font-size="16" font-weight="700"><text x="110" y="154">FL · (+a,+a)</text><text x="498" y="154">FR · (+a,−a)</text><text x="110" y="529">RL · (−a,+a)</text><text x="498" y="529">RR · (−a,−a)</text></g>
