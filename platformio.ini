[platformio]
default_envs = esp32-s3
src_dir = firmware/src
include_dir = firmware/include

[env:esp32-s3]
platform = espressif32@7.1.3
board = esp32-s3-devkitc-1
framework = arduino
monitor_speed = 115200
build_flags =
    -DCORE_DEBUG_LEVEL=1
    -Wall
    -Wextra
extra_scripts = pre:tools/platformio/patch_xbox.py
lib_deps =
    electroniccats/MPU6050@1.4.5
    adafruit/Adafruit BMP280 Library@2.6.8
    adafruit/Adafruit BusIO@1.17.4
    adafruit/Adafruit Unified Sensor@1.1.15
    asukiaaa/XboxSeriesXControllerESP32_asukiaaa@1.1.3
    h2zero/NimBLE-Arduino@2.5.1
    asukiaaa/XboxControllerNotificationParser@1.0.5
    asukiaaa/XboxSeriesXHIDReportBuilder_asukiaaa@1.0.1
